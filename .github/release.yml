# Shapes the release notes that "Generate release notes" (and the release
# workflow) produce. Pull requests are grouped by label; unlabeled ones land
# under "Other changes". First-time contributors are listed automatically.
changelog:
  exclude:
    authors:
      - dependabot
      - dependabot[bot]
  categories:
    - title: Features
      labels:
        - enhancement
        - a2a-parity
    - title: Fixes
      labels:
        - bug
    - title: Security
      labels:
        - security
    - title: Documentation
      labels:
        - documentation
    - title: Dependencies
      labels:
        - dependencies
    - title: Other changes
      labels:
        - "*"
